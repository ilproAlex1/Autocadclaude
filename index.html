<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Misure Forme</title>
<style>
/* Tema unico chiaro (foglio tecnico) — scelta voluta */
:root{color-scheme:light;--acc:#1f6feb;--acc-soft:#e8f0fe;--bg:#f4f6fa;--txt:#1b2330;--mut:#6b7686;--line:#e3e7ee;--danger:#d93a3a;--ok:#16a34a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
.hidden{display:none!important}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:#fff;border-bottom:1px solid var(--line);min-height:56px;flex-shrink:0}
.icon-btn{width:40px;height:40px;flex-shrink:0;border:0;background:transparent;font-size:30px;line-height:1;border-radius:10px;cursor:pointer;color:var(--txt);display:flex;align-items:center;justify-content:center}
.icon-btn svg{width:24px;height:24px}
.icon-btn:active{background:var(--bg)}
.crumbs{flex:1;min-width:0;display:flex;gap:2px;align-items:center;overflow-x:auto;white-space:nowrap;font-weight:700;font-size:17px;scrollbar-width:none}
.crumbs button{border:0;background:none;font:inherit;color:var(--acc);padding:6px 4px;cursor:pointer}
.crumbs .sep{color:var(--mut);font-weight:400}
.crumbs .cur{color:var(--txt);padding:6px 4px}
.acct{flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 11px;font:inherit;font-size:13px;font-weight:650;color:var(--mut);cursor:pointer;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct.cloud{color:var(--ok);border-color:#bfe8cf;background:#f0fbf4}
.list{flex:1;overflow-y:auto;padding:16px;padding-bottom:130px}
.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:4px 2px 10px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;position:relative;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:transform .1s}
.card:active{transform:scale(.98)}
.card .more{position:absolute;top:4px;right:4px;width:36px;height:36px;border:0;background:transparent;border-radius:10px;font-size:20px;color:var(--mut);cursor:pointer}
.card .more:active{background:var(--bg)}
.card .ico{width:44px;height:36px;color:#f2b632}
.card .name{font-weight:650;word-break:break-word;padding-right:26px;font-size:15px}
.card .meta{font-size:12px;color:var(--mut)}
.thumb{height:96px;background:#f8fafc;border:1px solid #eef1f5;border-radius:10px;margin-bottom:4px;overflow:hidden}
.thumb svg{width:100%;height:100%;display:block}
.empty{text-align:center;color:var(--mut);margin-top:12vh;padding:0 24px;line-height:1.5}
.empty .big{font-size:52px;margin-bottom:6px}
.empty b{color:var(--txt)}
.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:38px;line-height:1;box-shadow:0 6px 18px rgba(31,111,235,.42);cursor:pointer;z-index:5}
.fab:active{transform:scale(.95)}
.home-actions{position:fixed;left:16px;bottom:calc(30px + env(safe-area-inset-bottom));z-index:5}
.btn{border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:12px;padding:11px 16px;font-size:15px;font-weight:650;cursor:pointer;font-family:inherit}
.btn:active{filter:brightness(.95)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.5}
.shadow{box-shadow:0 4px 14px rgba(20,30,50,.12)}
/* editor */
.title-btn{flex:1;min-width:0;text-align:left;border:0;background:none;font:inherit;font-weight:700;font-size:17px;padding:6px 4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.title-btn small{display:block;font-weight:400;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.unit-sel{font:inherit;font-size:15px;font-weight:650;padding:7px 6px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--txt);flex-shrink:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-shrink:0}
.seg button{border:0;background:#fff;font:inherit;font-weight:700;font-size:14px;padding:8px 9px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
#stage{flex:1;position:relative;touch-action:none;overflow:hidden;background:#fbfcfe}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(27,35,48,.84);color:#fff;font-size:13px;padding:7px 13px;border-radius:20px;max-width:calc(100% - 80px);text-align:center;pointer-events:none;line-height:1.35}
.draft-bar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#fff;padding:6px;border-radius:14px;white-space:nowrap}
.zoom-ctrls{position:absolute;right:10px;top:54px;display:flex;flex-direction:column;gap:6px}
.zoom-ctrls button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer;color:var(--txt);display:flex;align-items:center;justify-content:center}
.zoom-ctrls svg{width:20px;height:20px}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:5px 6px;padding-bottom:max(6px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);flex-shrink:0}
.tools.t4{grid-template-columns:repeat(4,1fr)}
.tool{border:0;background:transparent;border-radius:10px;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);cursor:pointer;font-family:inherit}
.tool svg{width:24px;height:24px}
.tool.on{background:var(--acc-soft);color:var(--acc)}
.tool.toggle.on{background:#e7f7ee;color:var(--ok)}
.tool:active{background:var(--bg)}
.tool.danger{color:var(--danger)}
.result{position:absolute;left:10px;right:10px;bottom:10px;max-width:480px;margin:0 auto;background:#fff;border-radius:16px;padding:14px 16px;max-height:55%;overflow-y:auto}
.result h4{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.result h4 button{border:0;background:var(--bg);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
.result .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.result .row.sel{color:var(--acc);font-weight:700}
.result .row .v{font-weight:700;text-align:right}
.result .row .sub{display:block;font-size:12px;color:var(--mut);font-weight:400}
.result .tot{font-size:18px}
.result .note{color:var(--mut);font-size:14px;line-height:1.45}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal-box{background:#fff;width:100%;max-width:460px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px;padding-bottom:max(20px,env(safe-area-inset-bottom));animation:up .18s ease-out}
.modal-box.wide{max-width:620px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:600px){.modal{align-items:center}.modal-box{border-radius:20px}}
.modal-box h3{margin:0 0 6px;font-size:19px}
.modal-box p{margin:0 0 12px;color:var(--mut);font-size:14px;line-height:1.45}
.inp{width:100%;font-size:19px;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;outline:none;background:#fff;color:var(--txt)}
.inp:focus{border-color:var(--acc)}
.mrow{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
.mrow.left{justify-content:space-between}
.in-row{display:flex;gap:8px}
.in-row .inp{flex:1}
.in-row select{font-size:18px;padding:0 10px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-family:inherit}
.sheet-actions{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.sheet-actions .btn{width:100%;text-align:center}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld label{font-size:13px;color:var(--mut);font-weight:650}
.fld .inp{font-size:17px;padding:10px 12px}
.in-suf{display:flex;align-items:center;gap:8px}
.in-suf .inp{flex:1}
.suf{font-weight:700;color:var(--mut);min-width:26px}
.err{background:#fdecec;color:var(--danger);border-radius:10px;padding:8px 11px;font-size:14px;margin-top:4px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:6px}
.pick{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--txt);text-align:center;line-height:1.2}
.pick svg,.pick img{width:76px;height:56px;display:block;border-radius:8px;background:#fff}
.pick.on{border-color:var(--acc);background:var(--acc-soft)}
.pick:active{transform:scale(.97)}
.cm-list{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.cm-row{display:flex;align-items:center;gap:8px}
.cm-n{width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cm-n.v3{background:#f59e0b}
.cm-row .inp{flex:1;min-width:0;font-size:15px;padding:9px 10px}
.cm-v{min-width:92px;text-align:right;font-weight:700;font-size:14px}
.cm-v small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.cm-tot{display:flex;justify-content:space-between;font-weight:800;font-size:16px;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.cm-h{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:700;margin:12px 0 2px}
</style>
</head>
<body>

<!-- ===== HOME: cartelle ===== -->
<div id="home" class="screen">
  <header class="bar">
    <button id="btnUp" class="icon-btn" aria-label="Indietro">‹</button>
    <div class="crumbs" id="crumbs"></div>
    <button id="acct" class="acct" title="Account e salvataggio">📱 Su questo dispositivo</button>
  </header>
  <main id="list" class="list"></main>
  <div class="home-actions"><button id="btnNewFolder" class="btn shadow">📁 Nuova cartella</button></div>
  <button id="fab" class="fab" aria-label="Nuovo disegno" title="Nuovo disegno">+</button>
</div>

<!-- ===== EDITOR ===== -->
<div id="editor" class="screen hidden">
  <header class="bar">
    <button id="btnBack" class="icon-btn" aria-label="Indietro">‹</button>
    <button id="title" class="title-btn"></button>
    <div class="seg" id="modeSeg"><button data-mode="2d">2D</button><button data-mode="3d">3D</button></div>
    <select id="unitSel" class="unit-sel" aria-label="Unità di misura">
      <option value="mm">mm</option><option value="cm">cm</option><option value="m">m</option><option value="km">km</option>
    </select>
    <button id="btnPdf" class="icon-btn" aria-label="Computo metrico e PDF" title="Computo metrico e PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M14 3H6a1 1 0 00-1 1v16a1 1 0 001 1h12a1 1 0 001-1V8z"/><path d="M14 3v5h5M8.5 13h7M8.5 17h4.5"/></svg></button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint" class="hint"></div>
    <div class="zoom-ctrls">
      <button id="zIn" aria-label="Zoom avanti">+</button>
      <button id="zOut" aria-label="Zoom indietro">−</button>
      <button id="zFit" aria-label="Adatta allo schermo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div id="draftBar" class="draft-bar shadow hidden">
      <button class="btn sm" id="dUndo">↩ Punto</button>
      <button class="btn sm" id="dEnd">Termina</button>
      <button class="btn sm primary" id="dClose">Chiudi forma</button>
      <button class="btn sm ghost" id="dCancel">✕</button>
    </div>
    <div id="selBar" class="draft-bar shadow hidden">
      <button class="btn sm" id="sMerge">🔗 Unisci con un’altra forma</button>
      <button class="btn sm ghost" id="sMergeX">Annulla</button>
    </div>
    <div id="result" class="result shadow hidden"></div>
  </div>
  <nav class="tools" id="tools2d">
    <button class="tool" data-tool="select"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3l13 8-6 1.5L9 19z"/></svg>Seleziona</button>
    <button class="tool" data-tool="line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 19L9 6l7 9 4-10"/><circle cx="4" cy="19" r="1.6" fill="currentColor"/><circle cx="9" cy="6" r="1.6" fill="currentColor"/><circle cx="16" cy="15" r="1.6" fill="currentColor"/><circle cx="20" cy="5" r="1.6" fill="currentColor"/></svg>Linee</button>
    <button class="tool" id="tShape"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="7.5" cy="7.5" r="4.5"/><path d="M16.5 3l5 8.5h-10z"/><rect x="11" y="14" width="10" height="7" rx="1"/><path d="M3 21a5 5 0 0110 0z"/></svg>Forme</button>
    <button class="tool" data-tool="free"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 17c3-6 5-9 7-7s-1 7 2 7 4-9 9-11"/></svg>Mano libera</button>
    <button class="tool" id="tUndo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>Annulla</button>
    <button class="tool" id="tArea"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18L8 5h12l-3 13z" fill="currentColor" fill-opacity=".25"/></svg>Area</button>
    <button class="tool" id="tPerim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2.2"><path d="M4 18L8 5h12l-3 13z"/></svg>Perimetro</button>
    <button class="tool toggle" id="tOrtho"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4v16h16z"/><path d="M4 14h6v6"/></svg>Squadra</button>
    <button class="tool toggle" id="tGrid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4zM9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/></svg>Griglia</button>
    <button class="tool danger" id="tDel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Elimina</button>
  </nav>
  <nav class="tools hidden" id="tools3d">
    <button class="tool" id="s3Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>Aggiungi solido</button>
    <button class="tool" id="s3Ext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 17h10l6-4H10z" fill="currentColor" fill-opacity=".2"/><path d="M10 13V5M7 8l3-3 3 3"/></svg>Estrudi forma</button>
    <button class="tool" id="s3Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>Misure</button>
    <button class="tool" id="s3Vol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 4h12l-1.5 16h-9z"/><path d="M7 11h10" /><path d="M7.3 11h9.4l-.8 9H8.1z" fill="currentColor" fill-opacity=".3"/></svg>Volume</button>
    <button class="tool" id="s3Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>Annulla</button>
    <button class="tool" id="s3View"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Vista</button>
    <button class="tool" id="s3Merge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 9h9v11H3zM12 13h9v7h-9"/><path d="M12 9v4" stroke-dasharray="2 2"/></svg>Unisci</button>
    <button class="tool" id="s3Dup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/></svg>Duplica</button>
    <button class="tool danger" id="s3Del"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Elimina</button>
  </nav>
</div>

<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" class="hidden">

<script>
'use strict';
/* =================== DATI =================== */
const APP_VERSION = '4';   // si vede toccando il pulsante dell'account: serve a capire se il telefono ha l'ultima versione
const LS_KEY = 'misure_forme_v1';
const OPT_KEY = 'misure_forme_opts';
const OWNER_KEY = 'misure_forme_owner';
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
let db = loadDB();
let opts = {ortho:true, grid:false, unit:'cm', shape:'rect'};
try{ Object.assign(opts, JSON.parse(lsGet(OPT_KEY) || '{}')); }catch(e){}

function loadDB(){
  try{ const d = JSON.parse(lsGet(LS_KEY)); if(d && d.folders && d.drawings) return d; }catch(e){}
  return {folders:[], drawings:[]};
}
function persist(){ lsSet(LS_KEY, JSON.stringify(db)); scheduleSync(); }
function saveOpts(){ lsSet(OPT_KEY, JSON.stringify(opts)); }

/* ---- Salvataggio nel tuo account (quando l'app è aperta su claude.ai) ----
   Ogni persona ha uno spazio privato: data/users/<id>/ — nessun altro lo può leggere,
   nemmeno chi ha creato l'app. doc "folders" = elenco cartelle, doc "dw_<id>" = un disegno. */
let remote = null, synced = {}, syncTimer = null, syncing = false, syncAgain = false, dl = null;
let acct = {state:'local', name:''};
function remoteDocs(){
  const out = {folders: JSON.stringify({folders: db.folders})};
  db.drawings.forEach(d => { out['dw_' + d.id] = JSON.stringify(d); });
  return out;
}
function scheduleSync(){ if(!remote) return; clearTimeout(syncTimer); syncTimer = setTimeout(runSync, 700); setAcct('syncing'); }
async function runSync(){
  if(!remote) return;
  if(syncing){ syncAgain = true; return; }
  syncing = true;
  let ok = true;
  try{
    const want = remoteDocs();
    for(const id in want){
      if(synced[id] === want[id]) continue;
      await remote.doc(id).set(JSON.parse(want[id])); synced[id] = want[id];
    }
    for(const id in synced){
      if(!(id in want)){ await remote.doc(id).delete(); delete synced[id]; }
    }
  }catch(e){ ok = false; console.warn('Sincronizzazione non riuscita', e); if(D) toast('Salvataggio online non riuscito: i dati restano su questo dispositivo'); }
  syncing = false;
  if(syncAgain){ syncAgain = false; runSync(); return; }
  setAcct(ok ? 'cloud' : 'error');
}
function setAcct(state){
  if(state) acct.state = state;
  const b = $('#acct');
  b.classList.toggle('cloud', acct.state === 'cloud' || acct.state === 'syncing');
  b.textContent = acct.state === 'local' ? '📱 Su questo dispositivo'
    : acct.state === 'error' ? '⚠️ Non sincronizzato'
    : acct.state === 'syncing' ? '☁️ Salvataggio…'
    : '☁️ ' + (acct.name || 'Il mio account');
}
async function pullRemote(){
  const snap = await Promise.race([remote.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))]);
  const next = {folders:[], drawings:[]}; const s2 = {};
  snap.docs.forEach(d => {
    const v = d.data(); if(!v) return;
    if(d.id === 'folders'){ next.folders = Array.isArray(v.folders) ? v.folders : []; s2.folders = JSON.stringify({folders: next.folders}); }
    else if(d.id.startsWith('dw_') && Array.isArray(v.shapes)){ next.drawings.push(v); s2[d.id] = JSON.stringify(v); }
  });
  return {empty: snap.empty, next, s2};
}
async function initRemote(){
  if(!window.claude || !window.claude.use) return;
  claude.use('downloads').then(x => { dl = x; }).catch(() => {});
  try{
    const [dbc, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!dbc || !user) return;
    const id = await user.id(); if(!id) return;
    try{ const me = await user.me(); acct.name = (me && me.name) || ''; }catch(e){}
    remote = dbc.collection('data/users/' + id);
    const owner = lsGet(OWNER_KEY);
    const r = await pullRemote();
    lsSet(OWNER_KEY, id);
    if(r.empty){
      // primo avvio online: porta su quello che c'è su questo dispositivo (solo se è tuo)
      if(owner && owner !== id){ db = {folders:[], drawings:[]}; lsSet(LS_KEY, JSON.stringify(db)); if(!D){ curFolder = null; renderHome(); } }
      setAcct('cloud');
      if(db.folders.length || db.drawings.length) runSync();
      return;
    }
    synced = r.s2; setAcct('cloud');
    if(D) return;                 // non interrompere un disegno già aperto
    db = r.next; lsSet(LS_KEY, JSON.stringify(db));
    if(curFolder && !db.folders.find(f => f.id === curFolder)) curFolder = null;
    renderHome();
  }catch(e){ console.warn('Archivio online non disponibile', e); remote = null; setAcct('local'); }
}

/* =================== UNITÀ =================== */
const UNITS = ['mm','cm','m','km'];
const UNIT_F = {mm:10, cm:1, m:0.01, km:0.00001};   // da cm a unità
const UNIT_DEC = {mm:0, cm:1, m:2, km:3};
const nf = (v, dec, min=0) => v.toLocaleString('it-IT', {maximumFractionDigits:dec, minimumFractionDigits:min});
const numStr = v => v.toLocaleString('it-IT', {maximumFractionDigits:4, useGrouping:false});
function fromCm(cm, u){ return cm * UNIT_F[u]; }
function toCm(v, u){ return v / UNIT_F[u]; }
function fmtLen(cm, u){ u = u || D.unit; return nf(fromCm(cm,u), UNIT_DEC[u], u==='m'?2:0) + ' ' + u; }
function fmtArea(cm2, u){
  u = u || D.unit;
  if(u==='km') return nf(cm2/1e10, 4) + ' km²';
  if(u==='m') return nf(cm2/1e4, 2, 2) + ' m²';
  if(u==='cm') return nf(cm2, 1) + ' cm²';
  return nf(cm2*100, 0) + ' mm²';
}
const fmtVol = cm3 => nf(cm3/1e6, 3, 3) + ' m³';
const fmtLitri = cm3 => nf(cm3/1000, 1) + ' litri';
function parseNum(s){ const v = parseFloat(String(s).replace(/\s/g,'').replace(',', '.')); return isFinite(v) ? v : NaN; }

let modalCancel = null;
function openModal(html, onCancel, wide){ $('#modalBox').innerHTML = html; $('#modalBox').classList.toggle('wide', !!wide); $('#modal').classList.remove('hidden'); modalCancel = onCancel || null; }
function closeModal(){ $('#modal').classList.add('hidden'); $('#modalBox').innerHTML=''; modalCancel = null; }

function askText(title, value, okLabel='OK', desc=''){

    openModal(`<h3>${esc(title)}</h3>${desc?`<p>${esc(desc)}</p>`:''}<input id="mIn" class="inp" maxlength="60" value="${esc(value||'')}">
      <div class="mrow"><button class="btn ghost" id="mCancel">Annulla</button><button class="btn primary" id="mOk">${esc(okLabel)}</button></div>`, () => res(null));
    const inp = $('#mIn'); setTimeout(() => { inp.focus(); inp.select(); }, 60);

function askConfirm(title, msg, okLabel='Elimina'){

/* Modulo generico per inserire le misure di una forma o di un solido.
   fields: [{k, n, t:'len'|'ang'|'int'|'sel', v, opts}] — le lunghezze sono in cm. */
function paramForm(o){
  let u = D.unit;
  const lenVal = (f) => f.v == null ? '' : numStr(fromCm(f.v, u));
  const fh = o.fields.map((f,i) => {
    if(f.t === 'sel') return `<div class="fld"><label for="pf${i}">${esc(f.n)}</label><select id="pf${i}" class="inp">${f.opts.map(([v,l]) => `<option value="${esc(v)}" ${v===f.v?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;
    const val = f.t === 'len' ? lenVal(f) : (f.v == null ? '' : numStr(f.v));
    const suf = f.t === 'len' ? `<span class="suf" data-suf>${u}</span>` : f.t === 'ang' ? '<span class="suf">°</span>' : '<span class="suf"></span>';
    return `<div class="fld"><label for="pf${i}">${esc(f.n)}</label><div class="in-suf"><input id="pf${i}" class="inp" inputmode="${f.t==='int'?'numeric':'decimal'}" autocomplete="off" placeholder="${f.t==='len'?'es. 3,50':''}" value="${val}">${suf}</div></div>`;
  }).join('');
  const hasLen = o.fields.some(f => f.t === 'len');
  openModal(`<h3>${esc(o.title)}</h3>${o.desc ? `<p>${o.desc}</p>` : ''}
    ${hasLen ? `<div class="fld"><label for="pfU">Unità di misura</label><select id="pfU" class="inp">${UNITS.map(x => `<option ${x===u?'selected':''}>${x}</option>`).join('')}</select></div>` : ''}
    ${fh}
    ${o.rot != null ? `<div class="fld"><label for="pfR">Rotazione</label><div class="in-suf"><input id="pfR" class="inp" inputmode="decimal" autocomplete="off" value="${numStr(o.rot)}"><span class="suf">°</span></div></div>` : ''}
    ${o.name ? `<div class="fld"><label for="pfN">Descrizione (per il computo)</label><input id="pfN" class="inp" maxlength="80" placeholder="${esc(o.name.ph)}" value="${esc(o.name.v||'')}"></div>` : ''}
    ${o.extra ? `<div class="sheet-actions"><button class="btn" id="pfExtra">${esc(o.extra.label)}</button></div>` : ''}
    <div id="pfErr" class="err hidden"></div>
    <div class="mrow left">${o.onDel ? `<button class="btn danger" id="pfDel">${esc(o.delLabel || 'Elimina')}</button>` : '<span></span>'}
      <span style="display:flex;gap:8px"><button class="btn ghost" id="pfCancel">Annulla</button><button class="btn primary" id="pfOk">${esc(o.okLabel || 'Salva')}</button></span></div>`);
  const first = o.fields.findIndex(f => f.t !== 'sel');
  if(first >= 0) setTimeout(() => focusEnd($('#pf' + first)), 60);
  if(hasLen) $('#pfU').onchange = e => {
    const nu = e.target.value;
    o.fields.forEach((f,i) => { if(f.t !== 'len') return; const el = $('#pf'+i); const v = parseNum(el.value); if(isFinite(v)) el.value = numStr(fromCm(toCm(v, u), nu)); });
    u = nu; $('#modalBox').querySelectorAll('[data-suf]').forEach(s => s.textContent = u);
  };
  const showErr = m => { const e = $('#pfErr'); e.textContent = m; e.classList.remove('hidden'); };
  $('#pfCancel').onclick = () => { closeModal(); if(o.onCancel) o.onCancel(); };
  if(o.onDel) $('#pfDel').onclick = () => { closeModal(); o.onDel(); };
  if(o.extra) $('#pfExtra').onclick = () => { closeModal(); o.extra.fn(); };
  $('#pfOk').onclick = () => {
    const vals = {};
    for(let i = 0; i < o.fields.length; i++){
      const f = o.fields[i], el = $('#pf'+i);
      if(f.t === 'sel'){ vals[f.k] = el.value; continue; }
      const s = el.value.trim();
      if(!s){ vals[f.k] = null; continue; }
      const v = parseNum(s);
      if(!(v > 0)){ el.style.borderColor = 'var(--danger)'; el.focus(); return showErr('Controlla “' + f.n + '”: serve un numero maggiore di zero.'); }
      vals[f.k] = f.t === 'len' ? toCm(v, u) : f.t === 'int' ? Math.round(v) : v;
    }
    let rot = null;
    if(o.rot != null){ rot = parseNum($('#pfR').value || '0'); if(!isFinite(rot)) return showErr('Rotazione non valida'); }
    const name = o.name ? $('#pfN').value.trim() : null;
    const err = o.onSave(vals, {unit:u, rot, name});
    if(err) return showErr(err);
    closeModal();
  };
  $('#modalBox').querySelectorAll('input').forEach(el => el.addEventListener('keydown', e => { if(e.key === 'Enter') $('#pfOk').click(); if(e.key === 'Escape') $('#pfCancel').click(); }));
}

function folderPath(id){
  const path = []; let f = db.folders.find(x => x.id === id);
  while(f){ path.unshift(f); f = db.folders.find(x => x.id === f.parentId); }
  return path;
}
function countIn(fid){
  return { f: db.folders.filter(x => x.parentId === fid).length, d: db.drawings.filter(x => x.folderId === fid).length };
}
function descendants(fid){
  const out = [fid];
  for(let i=0;i<out.length;i++) db.folders.filter(f => f.parentId === out[i]).forEach(f => out.push(f.id));
  return out;
}
function plural(n, s, p){ return n + ' ' + (n===1 ? s : p); }

function ringsPath(rings, closed){ return rings.map(r => r.map((p,i) => (i?'L':'M') + p.x.toFixed(3) + ' ' + p.y.toFixed(3)).join('') + (closed ? 'Z' : '')).join(''); }
function thumbSVG(d){
  const pts = d.shapes.flatMap(s => s.pts);
  if(!pts.length) return `<svg viewBox="0 0 100 60"><text x="50" y="34" text-anchor="middle" font-size="9" fill="#9aa4b2">${(d.solids||[]).length ? '3D · ' + plural(d.solids.length,'solido','solidi') : 'vuoto'}</text></svg>`;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  pts.forEach(p => { x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); });
  const w = Math.max(x1-x0, 1e-9), h = Math.max(y1-y0, 1e-9), pad = Math.max(w,h)*0.12;
  const vb = `${x0-pad} ${y0-pad} ${w+pad*2} ${h+pad*2}`;
  const body = d.shapes.map(s => `<path d="${ringsPath([s.pts, ...(s.holes||[])], s.closed)}" fill="${s.closed?'rgba(31,111,235,.1)':'none'}" fill-rule="evenodd" stroke="#243042" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`).join('');
  return `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet">${body}</svg>`;
}

$('#fileIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if(!Array.isArray(d.folders) || !Array.isArray(d.drawings)) throw new Error('formato');
    let nf = 0, nd = 0;
    d.folders.forEach(x => { if(x && x.id && !db.folders.find(y => y.id === x.id)){ db.folders.push(x); nf++; } });
    d.drawings.forEach(x => {
      if(!x || !x.id || !Array.isArray(x.shapes)) return;
      const i = db.drawings.findIndex(y => y.id === x.id);
      if(i < 0){ db.drawings.push(x); nd++; } else if((x.updated||0) > (db.drawings[i].updated||0)){ db.drawings[i] = x; nd++; }
    });
    persist(); renderHome();
    actionSheet('Backup importato', [], `Aggiunte ${plural(nf,'cartella','cartelle')} e ${plural(nd,'disegno','disegni')} (aggiornati o nuovi).`);
  }catch(err){ actionSheet('Importazione non riuscita', [], 'Il file scelto non è un backup di Misure Forme.'); }

async function saveFile(name, blob){

/* rigenera i punti di una forma parametrica dalla sua posizione/rotazione/misure */

  const byKey = new Map(); edges.forEach(e => { const k = e.a + '>' + e.b; if(!byKey.has(k)) byKey.set(k, []); byKey.get(k).push(e); });

const samePt = (a, b) => dist(a, b) <= tolPx()/view.z*0.5;

function cancelDraft(){
  if(draftFrom){ D.shapes.splice(Math.min(draftFrom.idx, D.shapes.length), 0, draftFrom.shape); history.pop(); }

function finishDraft(close){

    const last = pts[pts.length-1], s2 = openLines().find(s => samePt(s.pts[0], last) || samePt(s.pts[s.pts.length-1], last));
    if(s2){
      const fwd = samePt(s2.pts[0], last), sp = fwd ? s2.pts : s2.pts.slice().reverse();
      Object.assign(meas, remapMeasures(s2.measures, s2.pts.length, !fwd, pts.length - 1));

}

function buildFromBox(A, B){

  let dx = B.x - A.x, dy = B.y - A.y;
  if(t === 'square'){ const s = Math.max(Math.abs(dx), Math.abs(dy)); dx = (dx < 0 ? -1 : 1)*s; dy = (dy < 0 ? -1 : 1)*s; }
  const x0 = Math.min(A.x, A.x+dx), x1 = Math.max(A.x, A.x+dx), y0 = Math.min(A.y, A.y+dy), y1 = Math.max(A.y, A.y+dy);

  let w = x1 - x0, h = y1 - y0;
  if(w < h*0.08) w = h; if(h < w*0.08) h = w;
  const s = {id:uid(), geo:{t, p:SH[t].box(w, h), cx:(x0+x1)/2, cy:(y0+y1)/2, rot:0}, closed:true, measures:{}};

}

/* ---- geometria ---- */
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const ws = p => ({x: p.x*view.z + view.x, y: p.y*view.z + view.y});
const toW = p => ({x: (p.x - view.x)/view.z, y: (p.y - view.y)/view.z});
function segDist(p, a, b){
  const dx = b.x-a.x, dy = b.y-a.y, l2 = dx*dx + dy*dy;
  let t = l2 ? ((p.x-a.x)*dx + (p.y-a.y)*dy)/l2 : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x+t*dx), p.y - (a.y+t*dy));
}
function polyArea(pts){ let s = 0; for(let i=0;i<pts.length;i++){ const a = pts[i], b = pts[(i+1)%pts.length]; s += a.x*b.y - b.x*a.y; } return s/2; }
function centroid(pts){
  const A = polyArea(pts);
  if(Math.abs(A) < 1e-30){ return {x: pts.reduce((s,p)=>s+p.x,0)/pts.length, y: pts.reduce((s,p)=>s+p.y,0)/pts.length}; }
  let cx = 0, cy = 0;
  for(let i=0;i<pts.length;i++){ const a = pts[i], b = pts[(i+1)%pts.length], f = a.x*b.y - b.x*a.y; cx += (a.x+b.x)*f; cy += (a.y+b.y)*f; }
  return {x: cx/(6*A), y: cy/(6*A)};
}
function inPoly(p, pts){
  let c = false;
  for(let i=0, j=pts.length-1; i<pts.length; j=i++){
    const a = pts[i], b = pts[j];
    if(((a.y > p.y) !== (b.y > p.y)) && (p.x < (b.x-a.x)*(p.y-a.y)/(b.y-a.y) + a.x)) c = !c;
  }
  return c;
}
function rdp(pts, eps){
  if(pts.length < 3) return pts.slice();
  let dmax = 0, idx = 0; const a = pts[0], b = pts[pts.length-1];
  for(let i=1;i<pts.length-1;i++){ const d = segDist(pts[i], a, b); if(d > dmax){ dmax = d; idx = i; } }
  if(dmax > eps){ const l = rdp(pts.slice(0, idx+1), eps), r = rdp(pts.slice(idx), eps); return l.slice(0,-1).concat(r); }
  return [a, b];
}
function segCount(s){ return s.closed ? s.pts.length : s.pts.length - 1; }
function segLenCm(s, i){ return D.scale ? dist(s.pts[i], s.pts[(i+1)%s.pts.length]) * D.scale : null; }
function shapeAreaCm2(s){
  if(!D.scale || !s.closed) return null;
  const T = s.geo && SH[s.geo.t];
  const a = T && T.area ? T.area(s.geo.p) : Math.abs(polyArea(s.pts)) - (s.holes||[]).reduce((t,h) => t + Math.abs(polyArea(h)), 0);
  return a * D.scale * D.scale;
}
function shapePerimCm(s){
  if(!D.scale) return null;
  const T = s.geo && SH[s.geo.t];
  if(T && T.perim) return T.perim(s.geo.p) * D.scale;
  let t = 0; for(let i=0;i<segCount(s);i++) t += segLenCm(s,i); return t;
}
function niceStep(base){ const p = Math.pow(10, Math.floor(Math.log10(base))); for(const m of [1,2,5,10]) if(p*m >= base) return p*m; return p*10; }
function gridStep(){ return niceStep(22 / view.z); }
function dimsText(s){
  if(!D.scale) return 'senza misure';
  if(s.geo){
    const T = SH[s.geo.t], p = s.geo.p;
    return T.ps.map(q => q.n.replace(/ \(.*\)/, '') + ' ' + (q.t === 'len' ? fmtLen(p[q.k]*D.scale, 'm') : q.t === 'ang' ? nf(p[q.k],1) + '°' : p[q.k])).join(', ');
  }
  const L = []; for(let i=0;i<segCount(s);i++) L.push(nf(segLenCm(s,i)/100, 2, 2));
  if((s.kind === 'rect' || s.kind === 'square') && L.length === 4 && L[0] === L[2] && L[1] === L[3]) return L[0] + ' × ' + L[1] + ' m';
  return (L.length <= 6 ? 'lati ' + L.join(' + ') : L.length + ' lati') + ' m';
}

/* ---- aggancio (snap) ---- */
function tolPx(){ return lastPT === 'touch' ? 22 : 12; }
function snapPoint(w, from, exclude){
  const tol = tolPx() / view.z;
  // 1) aggancio a un vertice esistente
  let best = null, bd = tol;
  const consider = (p, sid, idx) => {
    if(exclude && exclude.sid === sid && exclude.idx === idx) return;
    const d = dist(p, w); if(d < bd){ bd = d; best = p; }
  };
  D.shapes.forEach(s => s.pts.forEach((p,i) => consider(p, s.id, i)));
  draft.forEach((p,i) => consider(p, 'draft', i));
  if(best) return {x:best.x, y:best.y, snap:'v'};
  let p = {x:w.x, y:w.y};
  // 2) griglia
  if(opts.grid){ const g = gridStep(); p.x = Math.round(p.x/g)*g; p.y = Math.round(p.y/g)*g; }
  // 3) squadra: 0/45/90°
  let lock = null;
  if(opts.ortho && from){
    const dx = p.x-from.x, dy = p.y-from.y;
    if(Math.hypot(dx,dy) > 0){
      const ang = Math.atan2(dy, dx), k = Math.round(ang/(Math.PI/4)), target = k*Math.PI/4;
      if(Math.abs(ang - target) < 0.13){
        const m = ((k % 4) + 4) % 4;
        if(m === 0){ p.y = from.y; lock = 'h'; }
        else if(m === 2){ p.x = from.x; lock = 'v'; }
        else { const ux = Math.cos(target), uy = Math.sin(target), t = dx*ux + dy*uy; p = {x:from.x+ux*t, y:from.y+uy*t}; lock = 'd'; }
      }
    }
  }
  // 4) allineamento con altri vertici (per chiudere bene le forme)
  if(!opts.grid && lock !== 'd'){
    const all = []; D.shapes.forEach(s => { if(isCurved(s)) return; s.pts.forEach((q,i) => { if(!(exclude && exclude.sid===s.id && exclude.idx===i)) all.push(q); }); }); draft.forEach(q => all.push(q));
    let gx = null, gy = null, bx = tol*0.7, by = tol*0.7;
    all.forEach(q => {
      if(q === from) return;
      if(lock !== 'v' && Math.abs(q.x - p.x) < bx){ bx = Math.abs(q.x-p.x); gx = q; }
      if(lock !== 'h' && Math.abs(q.y - p.y) < by){ by = Math.abs(q.y-p.y); gy = q; }
    });
    if(gx){ p.x = gx.x; p.gx = gx; }
    if(gy){ p.y = gy.y; p.gy = gy; }
  }
  return p;
}

/* ---- hit test ---- */
function hitVertex(sp){
  const tol = tolPx(); let best = null, bd = tol;
  const order = D.shapes.filter(s => !s.geo).sort((a,b) => (a.id===selShape) - (b.id===selShape)).reverse();
  for(const s of order) s.pts.forEach((p,i) => { const d = dist(ws(p), sp); if(d < bd){ bd = d; best = {shape:s, idx:i}; } });
  return best;
}
function hitSegment(sp){
  const tol = tolPx(); let best = null, bd = tol;
  for(const s of D.shapes){
    for(let i=0;i<segCount(s);i++){
      const d = segDist(sp, ws(s.pts[i]), ws(s.pts[(i+1)%s.pts.length]));
      if(d < bd){ bd = d; best = {shape:s, idx:i}; }
    }
  }
  return best;
}
function hitShape(sp){
  const w = toW(sp);
  for(let k=D.shapes.length-1;k>=0;k--){ const s = D.shapes[k]; if(s.closed && inPoly(w, s.pts) && !(s.holes||[]).some(h => inPoly(w, h))) return s; }
  return null;
}
/* Tocco su un lato: se è la linea in comune tra due forme si può eliminare (le forme diventano una),

function openShapeOrSide(shape, i){
  const nb = sharedNeighbor(shape, i);
  const measure = () => shape.geo ? openShapeDims(shape) : openMeasure(shape, i);
  if(!nb) return measure();
  selShape = shape.id; draw();
  actionSheet('Linea in comune tra due forme', [
    {label:'✂️ Elimina questa linea (unisci in una forma sola)', fn: () => tryMerge(shape, nb)},
    {label:'📏 Scrivi la misura di questo lato', fn: measure},
  ], 'Eliminando la linea le due forme diventano un’unica forma, con un’unica area.');
}
/* cursore alla fine del numero, senza selezionarlo tutto */
function focusEnd(el){ if(!el) return; el.focus(); try{ const n = el.value.length; el.setSelectionRange(n, n); }catch(e){} }

/* ---- MISURA di un lato ---- */
function openMeasure(shape, i){
  selShape = shape.id; draw();
  const m = shape.measures[i];
  let u = D.unit;
  const valStr = m != null ? numStr(fromCm(m, u)) : '';
  const desc = D.scale
    ? `Scrivi la misura reale di questo lato: il disegno si adatterà.`
    : `Prima misura del disegno: serve a fissare la scala del disegno.`;
  openModal(`<h3>Misura del lato</h3><p>${desc}</p>
    <div class="in-row"><input id="mVal" class="inp" inputmode="decimal" autocomplete="off" placeholder="es. 3,50" value="${valStr}">
    <select id="mUnit">${UNITS.map(x => `<option ${x===u?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="mrow left">${m != null ? `<button class="btn danger" id="mDel">Rimuovi misura</button>` : '<span></span>'}
      <span style="display:flex;gap:8px"><button class="btn ghost" id="mCancel">Annulla</button><button class="btn primary" id="mOk">Salva</button></span></div>`);
  const inp = $('#mVal'); setTimeout(() => focusEnd(inp), 60);
  // cambiando unità il numero viene convertito (350 cm → 3,5 m), così la forma non cambia
  $('#mUnit').onchange = e => { const v = parseNum(inp.value); if(isFinite(v)) inp.value = numStr(fromCm(toCm(v, u), e.target.value)); u = e.target.value; };
  $('#mCancel').onclick = closeModal;
  $('#mOk').onclick = () => {
    const v = parseNum(inp.value);
    if(!(v > 0)){ inp.style.borderColor = 'var(--danger)'; inp.focus(); return; }
    const unit = $('#mUnit').value;
    if(unit !== D.unit) setUnit(unit);
    closeModal(); pushHistory(); applyMeasure(shape, i, toCm(v, unit)); save(); refresh(); keepInView();
  };
  inp.onkeydown = e => { if(e.key === 'Enter') $('#mOk').click(); if(e.key === 'Escape') closeModal(); };
  if(m != null) $('#mDel').onclick = () => {
    closeModal(); pushHistory(); delete shape.measures[i];
    if(!hasMeasures()) D.scale = null;
    save(); refresh();
  };
}
/* Imposta la lunghezza del lato i: la prima misura fissa la scala, le successive
   "stirano" la forma lungo la direzione del lato (come lo STRETCH dei CAD),
   così rettangoli e forme ad angolo retto restano squadrati. */
function applyMeasure(shape, i, cm){
  const n = shape.pts.length, A = shape.pts[i], bi = (i+1) % n, B = shape.pts[bi];
  const cur = dist(A, B); if(!(cur > 0)) return;
  if(!D.scale){ D.scale = cm / cur; shape.measures[i] = cm; return; }
  const L = cm / D.scale, delta = L - cur, ux = (B.x-A.x)/cur, uy = (B.y-A.y)/cur, eps = cur*0.02;
  shape.pts.forEach((P, j) => {
    if(j === i) return;
    const proj = (P.x-A.x)*ux + (P.y-A.y)*uy;
    if(j === bi || proj >= cur - eps){ P.x += ux*delta; P.y += uy*delta; }
  });
  shape.measures[i] = cm;
}
/* ---- MISURE di una forma parametrica (cerchio, triangolo, ...) ---- */
/* le misure che hai scritto tu (le altre non vengono proposte) */
function geoMeasured(s, k){ return !!(s.geo.measured && (s.geo.mk ? s.geo.mk[k] : true)); }
function geoAllMeasured(s){ return SH[s.geo.t].ps.every(q => q.t !== 'len' || geoMeasured(s, q.k)); }
function openShapeDims(s){
  selShape = s.id; draw();
  const T = SH[s.geo.t], p = s.geo.p;
  paramForm({
    title: 'Misure: ' + T.nm,
    desc: D.scale ? 'Scrivi le misure reali: la forma si adatta.' : 'Prima misura del disegno: fissa la scala del disegno.',
    fields: T.ps.map(q => ({k:q.k, n:q.n, t:q.t, v: q.t === 'len' ? (D.scale && geoMeasured(s, q.k) ? p[q.k]*D.scale : null) : p[q.k]})),
    rot: s.geo.rot || 0,
    name: {v:s.name, ph:T.nm},
    delLabel: 'Elimina forma', onDel: () => { selShape = s.id; deleteSelected(); },
    onSave: (vals, ex) => {
      const np = {...p}; let sc = D.scale;
      const lens = T.ps.filter(q => q.t === 'len');
      if(!sc){ const first = lens.find(q => vals[q.k] != null); if(first) sc = vals[first.k] / p[first.k]; }
      let anyLen = false; const mk = {...(s.geo.mk || (s.geo.measured ? Object.fromEntries(lens.map(q => [q.k, true])) : {}))};
      T.ps.forEach(q => {
        if(vals[q.k] == null){ if(q.t === 'len') delete mk[q.k]; return; }
        if(q.t === 'len'){ if(sc){ np[q.k] = vals[q.k] / sc; anyLen = true; mk[q.k] = true; } }
        else np[q.k] = vals[q.k];
      });
      const err = T.chk && T.chk(np); if(err) return err;
      pushHistory();
      D.scale = sc; s.geo.p = np; s.geo.rot = ex.rot || 0; s.name = ex.name || '';
      s.geo.mk = mk; s.geo.measured = anyLen || Object.keys(mk).length > 0;
      if(ex.unit !== D.unit) setUnit(ex.unit);
      regen(s); save(); refresh(); keepInView();
      return null;
    }
  });
}

/* ---- risultati Area / Perimetro / Volume ---- */
function renderResult(){
  const el = $('#result');
  $('#tArea').classList.toggle('on', resultKind === 'area');
  $('#tPerim').classList.toggle('on', resultKind === 'perim');
  $('#s3Vol').classList.toggle('on', resultKind === 'vol');
  if(!resultKind || !D){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  if(resultKind === 'vol') return renderVolumes(el);
  const title = resultKind === 'area' ? 'Area' : 'Perimetro';
  let body = '';
  if(!D.shapes.length) body = `<div class="note">Disegna prima una forma.</div>`;
  else if(!D.scale) body = `<div class="note">Inserisci almeno <b>una misura</b>: tocca un lato della forma e scrivi la sua lunghezza reale. Poi il calcolo è automatico.</div>`;
  else {
    let tot = 0, cnt = 0;
    D.shapes.forEach((s, k) => {
      const sel = s.id === selShape ? ' sel' : '', lab = esc(shapeLabel(s, k));
      if(resultKind === 'area'){
        if(!s.closed){ body += `<div class="row${sel}"><span>${lab}</span><span class="v"><span class="sub">forma aperta – chiudila per l'area</span></span></div>`; return; }
        const a = shapeAreaCm2(s); tot += a; cnt++;
        const alt = D.unit === 'm' ? fmtArea(a,'cm') : fmtArea(a,'m');
        body += `<div class="row${sel}"><span>${lab}</span><span class="v">${fmtArea(a)}<span class="sub">${alt}</span></span></div>`;
      } else {
        const p = shapePerimCm(s); tot += p; cnt++;
        let exp;
        if(isCurved(s)) exp = esc(SH[s.geo.t].lab(s.geo.p));
        else { const sides = []; for(let i=0;i<segCount(s);i++) sides.push(nf(fromCm(segLenCm(s,i), D.unit), UNIT_DEC[D.unit], D.unit==='m'?2:0)); exp = sides.length <= 8 ? sides.join(' + ') : sides.length + ' lati'; }
        body += `<div class="row${sel}"><span>${lab}${s.closed?'':' <span class="sub">(aperta)</span>'}</span><span class="v">${fmtLen(p)}<span class="sub">${exp}</span></span></div>`;
      }
    });
    if(cnt > 1) body += `<div class="row tot"><span><b>Totale</b></span><span class="v">${resultKind === 'area' ? fmtArea(tot) : fmtLen(tot)}</span></div>`;
    const unmeasured = D.shapes.reduce((n,s) => n + (s.geo ? (geoAllMeasured(s) ? 0 : 1) : segCount(s) - Object.keys(s.measures).length), 0);
    if(unmeasured) body += `<div class="note" style="margin-top:8px">ℹ️ Alcuni lati non hanno ancora la tua misura: finché non la scrivi, il calcolo usa la forma come l’hai disegnata.</div>`;
    body += `<div class="mrow"><button class="btn sm primary" id="rPdf">📄 Computo metrico PDF</button></div>`;
  }
  el.innerHTML = `<h4>${title}<button id="rClose" aria-label="Chiudi">✕</button></h4>${body}`;
  $('#rClose').onclick = () => { resultKind = null; showArea = false; renderResult(); draw(); };
  const rp = $('#rPdf'); if(rp) rp.onclick = openComputo;
}

/* ---- vista ---- */
function resize(){
  dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  // se lo schermo cambia dimensione (tastiera, rotazione) il disegno resta al centro, con la stessa scala
  if(lastSize && W && H){ view.x += (W - lastSize.W)/2; view.y += (H - lastSize.H)/2; }
  if(W && H) lastSize = {W, H};
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  draw();
}
window.addEventListener('resize', () => { if(D) resize(); });
function fitView(){
  const W = cv.clientWidth, H = cv.clientHeight;
  const pts = D.shapes.flatMap(s => s.pts);
  if(!pts.length){ view = {x:W/2, y:H/2, z:1}; return draw(); }
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  pts.forEach(p => { x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); });
  const bw = Math.max(x1-x0, 1e-9), bh = Math.max(y1-y0, 1e-9);
  const z = clamp(Math.min((W-110)/bw, (H-150)/bh), ZMIN, ZMAX);
  view = {z, x: W/2 - (x0+bw/2)*z, y: H/2 - (y0+bh/2)*z + 10};
  draw();
}
/* dopo una misura il disegno resta sempre visibile sullo schermo (se esce o diventa minuscolo, si riadatta) */
function keepInView(){
  if(!D || mode !== '2d' || !D.shapes.length) return;
  const W = cv.clientWidth, H = cv.clientHeight;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  D.shapes.forEach(s => s.pts.forEach(q => { const p = ws(q); x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); }));
  if(x0 < 8 || y0 < 50 || x1 > W - 8 || y1 > H - 70 || (x1 - x0 < 60 && y1 - y0 < 60)) fitView();
}
function zoomAt(p, f){
  if(mode === '3d') return zoom3D(p, f);
  const w = toW(p), z = clamp(view.z * f, ZMIN, ZMAX);
  view = {z, x: p.x - w.x*z, y: p.y - w.y*z}; draw();
}

/* ---- disegno su canvas ---- */
function rr(c, x, y, w, h, r){ c.beginPath(); if(c.roundRect) c.roundRect(x,y,w,h,r); else c.rect(x,y,w,h); }
function pill(text, x, y, angle, color, bg, bold, c){
  c = c || ctx;
  c.save(); c.translate(x, y); c.rotate(angle || 0);
  c.font = `${bold ? '700' : '600'} 13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif`;
  const w = c.measureText(text).width + 12;
  rr(c, -w/2, -10, w, 20, 6); c.fillStyle = bg || 'rgba(255,255,255,.93)'; c.fill();
  c.strokeStyle = 'rgba(0,0,0,.08)'; c.lineWidth = 1; c.stroke();
  c.fillStyle = color; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, 0, 0.5);
  c.restore();
}
function draw(){
  if(!D) return;
  if(mode === '3d') return draw3D();
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = '#fbfcfe'; ctx.fillRect(0,0,W,H);
  drawGrid(W, H);
  D.shapes.forEach(drawShape);
  drawDraft();
  if(act && act.type === 'shape' && act.moved){
    const pv = buildFromBox(act.a, act.b);
    ctx.setLineDash([6,4]); ctx.strokeStyle = '#1f6feb'; ctx.lineWidth = 2; ctx.fillStyle = 'rgba(31,111,235,.08)';
    pathShape(pv); ctx.fill('evenodd'); ctx.stroke(); ctx.setLineDash([]);
  }
  if(act && act.type === 'free' && act.pts.length > 1){
    ctx.strokeStyle = '#1f6feb'; ctx.lineWidth = 2.5; ctx.lineJoin = ctx.lineCap = 'round';
    ctx.beginPath(); act.pts.forEach((p,i) => { const s = ws(p); i ? ctx.lineTo(s.x,s.y) : ctx.moveTo(s.x,s.y); }); ctx.stroke();
  }
  D.shapes.forEach(drawLabels);
  if(showArea && D.scale) D.shapes.forEach(s => {
    if(!s.closed) return;
    const c = ws(centroid(s.pts));
    pill(fmtArea(shapeAreaCm2(s)), c.x, c.y, 0, '#fff', '#1f6feb', true);
  });
}
function drawGrid(W, H){
  const g = gridStep(), z = view.z;
  const wx0 = -view.x/z, wy0 = -view.y/z, wx1 = (W-view.x)/z, wy1 = (H-view.y)/z;
  ctx.lineWidth = 1;
  for(let i = Math.floor(wx0/g); i*g <= wx1; i++){
    const x = Math.round(i*g*z + view.x) + 0.5;
    ctx.strokeStyle = i % 5 === 0 ? '#dfe4ec' : '#eef1f6'; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  for(let i = Math.floor(wy0/g); i*g <= wy1; i++){
    const y = Math.round(i*g*z + view.y) + 0.5;
    ctx.strokeStyle = i % 5 === 0 ? '#dfe4ec' : '#eef1f6'; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
}
function pathShape(s){
  ctx.beginPath();
  [s.pts, ...(s.holes||[])].forEach(r => { r.forEach((q,i) => { const p = ws(q); i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y); }); if(s.closed) ctx.closePath(); });
}
function drawShape(s){
  const sel = s.id === selShape;
  pathShape(s);
  if(s.closed){ ctx.fillStyle = sel ? 'rgba(31,111,235,.13)' : 'rgba(31,111,235,.06)'; ctx.fill('evenodd'); }
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.lineWidth = sel ? 3 : 2; ctx.strokeStyle = sel ? '#1f6feb' : '#243042'; ctx.stroke();
  if(s.geo) return;
  s.pts.map(ws).forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, sel ? 5.5 : 3.5, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = sel ? '#1f6feb' : '#243042'; ctx.stroke(); });
}
function drawLabels(s){
  const n = s.pts.length, sel = s.id === selShape;
  const C = ws(s.closed ? centroid(s.pts) : {x: s.pts.reduce((a,p)=>a+p.x,0)/n, y: s.pts.reduce((a,p)=>a+p.y,0)/n});
  // si mostrano solo le misure scritte da te: i lati senza misura restano vuoti (con "?" se la forma è selezionata)
  if(s.geo){
    const all = D.scale && geoAllMeasured(s);
    if(!all){ if(sel) pill('tocca per le misure', C.x, C.y + (showArea ? 24 : 0), 0, '#6b7686'); return; }
    if(isCurved(s)){ pill(SH[s.geo.t].lab(s.geo.p), C.x, C.y + (showArea ? 24 : 0), 0, '#1b2330', null, true); return; }
  }
  for(let i=0;i<segCount(s);i++){
    const A = ws(s.pts[i]), B = ws(s.pts[(i+1)%n]), sl = dist(A,B);
    if(sl < 28) continue;
    const m = s.geo ? null : s.measures[i], cm = segLenCm(s, i);
    let text, color, bold = true;
    if(s.geo){ text = fmtLen(cm); color = '#1b2330'; }
    else if(m != null){ const bad = cm != null && Math.abs(cm - m) / m > 0.005; text = fmtLen(m); color = bad ? '#d93a3a' : '#1b2330'; }
    else { if(!sel) continue; text = '?'; color = '#9aa4b2'; bold = false; }
    const mid = {x:(A.x+B.x)/2, y:(A.y+B.y)/2};
    let nx = -(B.y-A.y)/sl, ny = (B.x-A.x)/sl;
    if(nx*(mid.x-C.x) + ny*(mid.y-C.y) < 0){ nx = -nx; ny = -ny; }
    let ang = Math.atan2(B.y-A.y, B.x-A.x);
    if(ang > Math.PI/2) ang -= Math.PI; if(ang < -Math.PI/2) ang += Math.PI;
    pill(text, mid.x + nx*15, mid.y + ny*15, ang, color, null, bold);
  }
}
function drawDraft(){
  if(!draft.length) return;
  const P = draft.map(ws);
  ctx.lineJoin = ctx.lineCap = 'round';
  ctx.beginPath(); P.forEach((p,i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
  ctx.strokeStyle = '#1f6feb'; ctx.lineWidth = 2.5; ctx.stroke();
  if(rubber){
    const L = P[P.length-1], R = ws(rubber);
    if(rubber.gx){ const g = ws(rubber.gx); guide(g, R); }
    if(rubber.gy){ const g = ws(rubber.gy); guide(g, R); }
    ctx.setLineDash([7,5]); ctx.beginPath(); ctx.moveTo(L.x,L.y); ctx.lineTo(R.x,R.y); ctx.strokeStyle = '#1f6feb'; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(R.x, R.y, rubber.snap ? 9 : 4, 0, Math.PI*2);
    ctx.strokeStyle = rubber.snap ? '#f59e0b' : '#1f6feb'; ctx.lineWidth = 2; ctx.stroke();
  }
  P.forEach((p,i) => {
    ctx.beginPath(); ctx.arc(p.x, p.y, i === 0 && draft.length >= 3 ? 9 : 5, 0, Math.PI*2);
    ctx.fillStyle = i === 0 && draft.length >= 3 ? 'rgba(22,163,74,.2)' : '#fff'; ctx.fill();
    ctx.strokeStyle = i === 0 && draft.length >= 3 ? '#16a34a' : '#1f6feb'; ctx.lineWidth = 2; ctx.stroke();
  });
}
function guide(a, b){ ctx.save(); ctx.setLineDash([3,4]); ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.restore(); }

/* ---- input: puntatore / touch ---- */
const pointers = new Map();
let gesture = null, gestureLock = false;
function sp(e){ const r = cv.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; }

cv.addEventListener('pointerdown', e => {
  lastPT = e.pointerType; try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  const p = sp(e); pointers.set(e.pointerId, p);
  if(pointers.size === 2){
    // inizia pinch/pan con due dita: annulla l'azione singola
    if(act && act.type === 'line' && act.startedNow){ if(draftFrom) cancelDraft(); else draft = []; }
    act = null; act3 = null; rubber = draft.length ? rubber : null;
    const [a, b] = [...pointers.values()];
    gesture = {mid:{x:(a.x+b.x)/2, y:(a.y+b.y)/2}, d: Math.max(dist(a,b), 1), view:{...view}, cam:{...cam}};
    gestureLock = true; refresh(); return;
  }
  if(pointers.size > 2 || gestureLock) return;
  if(mode === '3d'){ act3 = {down:p, last:p, moved:false, pan: e.button === 1 || e.button === 2 || e.shiftKey}; return; }
  if(e.button === 1 || e.button === 2){ act = {type:'pan', down:p, view0:{...view}, moved:true}; return; }
  onDown(p);
  draw();
});
cv.addEventListener('pointermove', e => {
  const p = sp(e);
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId, p);
  if(gesture && pointers.size >= 2){
    const [a, b] = [...pointers.values()];
    const mid = {x:(a.x+b.x)/2, y:(a.y+b.y)/2}, f = Math.max(dist(a,b), 1) / gesture.d;
    if(mode === '3d'){
      const g = gesture.cam, W = cv.clientWidth, H = cv.clientHeight, k = clamp(g.k * f, ZMIN, ZMAX);
      const X = (gesture.mid.x - W/2 - g.px)/g.k, U = (gesture.mid.y - H/2 - g.py)/g.k;
      cam.k = k; cam.px = mid.x - W/2 - X*k; cam.py = mid.y - H/2 - U*k; draw(); return;
    }
    const z = clamp(gesture.view.z * f, ZMIN, ZMAX);
    const wm = {x:(gesture.mid.x - gesture.view.x)/gesture.view.z, y:(gesture.mid.y - gesture.view.y)/gesture.view.z};
    view = {z, x: mid.x - wm.x*z, y: mid.y - wm.y*z}; draw(); return;
  }
  if(mode === '3d'){ if(act3) move3D(p); return; }

}

/* =================== COMPUTO METRICO + PDF =================== */
function openComputo(){
  if(!D.shapes.length && !D.solids.length) return toast('Disegna prima qualcosa');
  let h = `<h3>Computo metrico</h3><p>Dai un nome a ogni voce (es. “Pavimento cucina”): comparirà nel PDF insieme a misure, superfici e volumi.</p>`;
  if(D.shapes.length){
    let tot = 0;
    h += `<div class="cm-h">Superfici</div><div class="cm-list">` + D.shapes.map((s,k) => {
      const a = shapeAreaCm2(s); if(a) tot += a;
      return `<div class="cm-row"><span class="cm-n">${k+1}</span><input class="inp" data-sh="${s.id}" maxlength="80" placeholder="${esc(typeName(s))}" value="${esc(s.name||'')}"><span class="cm-v">${a != null ? fmtArea(a,'m') : '—'}<small>${a != null ? esc(typeName(s)) : (s.closed ? 'senza misure' : 'linea aperta')}</small></span></div>`;
    }).join('') + `</div><div class="cm-tot"><span>Totale superficie</span><span>${D.scale ? fmtArea(tot,'m') : '—'}</span></div>`;
    if(!D.scale) h += `<p style="margin-top:8px">ℹ️ Il disegno non ha ancora misure: tocca un lato e scrivi la lunghezza reale per avere i m².</p>`;
  }
  if(D.solids.length){
    let tot = 0;
    h += `<div class="cm-h">Volumi</div><div class="cm-list">` + D.solids.map((so,i) => {
      const v = solidVol(so); if(v != null) tot += v;
      return `<div class="cm-row"><span class="cm-n v3">${i+1}</span><input class="inp" data-so="${so.id}" maxlength="80" placeholder="${esc(solidName(so))}" value="${esc(so.name||'')}"><span class="cm-v">${v != null ? fmtVol(v) : '—'}<small>${v != null ? fmtLitri(v) : ''}</small></span></div>`;
    }).join('') + `</div><div class="cm-tot"><span>Totale volume</span><span>${fmtVol(tot)}</span></div>`;
  }
  h += `<div id="pdfErr" class="err hidden"></div><div class="mrow"><button class="btn ghost" id="cmClose">Chiudi</button><button class="btn primary" id="cmPdf">📄 Scarica PDF</button></div>`;
  const keep = () => {
    let ch = false;
    $('#modalBox').querySelectorAll('[data-sh]').forEach(i => { const s = D.shapes.find(x => x.id === i.dataset.sh); if(s && (s.name||'') !== i.value.trim()){ s.name = i.value.trim(); ch = true; } });
    $('#modalBox').querySelectorAll('[data-so]').forEach(i => { const s = D.solids.find(x => x.id === i.dataset.so); if(s && (s.name||'') !== i.value.trim()){ s.name = i.value.trim(); ch = true; } });
    if(ch){ save(); renderResult(); }
  };
  openModal(h, null, true);
  $('#modalBox').querySelectorAll('input').forEach(i => { i.addEventListener('input', keep); });
  $('#cmClose').onclick = () => { keep(); closeModal(); };
  $('#cmPdf').onclick = async () => {
    keep();
    const b = $('#cmPdf'); b.disabled = true; b.textContent = 'Preparo il PDF…';
    try{
      const bytes = buildPdf();
      const name = (D.name.replace(/[\\/:*?"<>|]+/g, ' ').trim() || 'disegno') + ' - computo metrico.pdf';
      const ok = await saveFile(name, new Blob([bytes], {type:'application/pdf'}));
      closeModal(); if(ok) toast('PDF pronto ✓');
    }catch(e){
      console.error(e); b.disabled = false; b.textContent = '📄 Scarica PDF';
      const er = $('#pdfErr'); if(er){ er.textContent = 'Non sono riuscito a creare il PDF: ' + (e && e.message || e); er.classList.remove('hidden'); }
    }
  };
}

/* ---- generatore PDF minimo (nessuna libreria): testo, linee, poligoni, immagini JPEG ---- */
const HW = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const CP1252 = {'€':128,'‚':130,'„':132,'…':133,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'›':155,'‹':139,'≈':126,'−':45};
function pdfTxt(s){
  let o = '';
  for(const ch of String(s)){
    let c = ch.codePointAt(0);
    if(CP1252[ch] != null) c = CP1252[ch]; else if(c > 255 || (c >= 127 && c < 160)) c = 63;
    const C = String.fromCharCode(c);
    o += (C === '(' || C === ')' || C === '\\') ? '\\' + C : C;
  }
  return o;
}
function tw(s, size, bold){ let w = 0; for(const ch of String(s)){ const c = ch.charCodeAt(0); w += (c >= 32 && c < 127) ? HW[c-32] : 556; } return w*size/1000*(bold ? 1.06 : 1); }
function fitTxt(s, size, maxw, bold){ s = String(s); if(tw(s, size, bold) <= maxw) return s; while(s.length > 1 && tw(s + '…', size, bold) > maxw) s = s.slice(0, -1); return s + '…'; }
const n2 = v => (Math.round(v*100)/100).toString();
const latin1 = s => { const b = new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i] = s.charCodeAt(i) & 255; return b; };
class PDF {
  constructor(){ this.W = 595.28; this.H = 841.89; this.pages = []; this.imgs = []; this.newPage(); }
  newPage(){ this.c = []; this.pages.push(this.c); }
  op(s){ this.c.push(s); }
  col(c){ return c.map(v => n2(v)).join(' '); }
  text(x, y, s, size = 10, bold = false, align = 'left', color = [0.106,0.137,0.188]){
    const w = tw(s, size, bold); if(align === 'right') x -= w; else if(align === 'center') x -= w/2;
    this.op(`BT /${bold ? 'F2' : 'F1'} ${size} Tf ${this.col(color)} rg ${n2(x)} ${n2(y)} Td (${pdfTxt(s)}) Tj ET`);
  }
  line(x1, y1, x2, y2, color = [0.85,0.87,0.91], w = 0.8){ this.op(`${this.col(color)} RG ${w} w ${n2(x1)} ${n2(y1)} m ${n2(x2)} ${n2(y2)} l S`); }
  fillRect(x, y, w, h, color){ this.op(`${this.col(color)} rg ${n2(x)} ${n2(y)} ${n2(w)} ${n2(h)} re f`); }
  strokeRect(x, y, w, h, color, lw = 0.8){ this.op(`${this.col(color)} RG ${lw} w ${n2(x)} ${n2(y)} ${n2(w)} ${n2(h)} re S`); }
  circle(x, y, r, color){ const k = 0.5523*r; this.op(`${this.col(color)} rg ${n2(x+r)} ${n2(y)} m ${n2(x+r)} ${n2(y+k)} ${n2(x+k)} ${n2(y+r)} ${n2(x)} ${n2(y+r)} c ${n2(x-k)} ${n2(y+r)} ${n2(x-r)} ${n2(y+k)} ${n2(x-r)} ${n2(y)} c ${n2(x-r)} ${n2(y-k)} ${n2(x-k)} ${n2(y-r)} ${n2(x)} ${n2(y-r)} c ${n2(x+k)} ${n2(y-r)} ${n2(x+r)} ${n2(y-k)} ${n2(x+r)} ${n2(y)} c f`); }
  image(bytes, iw, ih, x, y, w, h){ this.imgs.push({bytes, w:iw, h:ih}); this.op(`q ${n2(w)} 0 0 ${n2(h)} ${n2(x)} ${n2(y)} cm /Im${this.imgs.length} Do Q`); }
  build(){
    const objs = [], add = o => { objs.push(o); return objs.length; };
    add('<< /Type /Catalog /Pages 2 0 R >>'); add(null);
    const f1 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const im = this.imgs.map(i => add({dict:`<< /Type /XObject /Subtype /Image /Width ${i.w} /Height ${i.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${i.bytes.length} >>`, bin:i.bytes}));
    const xo = im.map((id, i) => `/Im${i+1} ${id} 0 R`).join(' ');
    const kids = this.pages.map(c => {
      const b = latin1(c.join('\n'));
      const cid = add({dict:`<< /Length ${b.length} >>`, bin:b});
      return add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >> /XObject << ${xo} >> >> /Contents ${cid} 0 R >>`);
    });
    objs[1] = `<< /Type /Pages /Kids [${kids.map(k => k + ' 0 R').join(' ')}] /Count ${kids.length} >>`;
    const chunks = [], offs = []; let off = 0;
    const push = b => { chunks.push(b); off += b.length; };
    push(latin1('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'));
    objs.forEach((o, i) => {
      offs.push(off);
      if(typeof o === 'string') push(latin1(`${i+1} 0 obj\n${o}\nendobj\n`));
      else { push(latin1(`${i+1} 0 obj\n${o.dict}\nstream\n`)); push(o.bin); push(latin1('\nendstream\nendobj\n')); }
    });
    const xref = off;
    let x = `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`;
    offs.forEach(o => { x += String(o).padStart(10, '0') + ' 00000 n \n'; });
    x += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
    push(latin1(x));
    const out = new Uint8Array(off); let p = 0; chunks.forEach(b => { out.set(b, p); p += b.length; });
    return out;
  }
}
const C_TXT = [0.106,0.137,0.188], C_MUT = [0.42,0.463,0.525], C_ACC = [0.122,0.435,0.922], C_HEAD = [0.937,0.949,0.973];
function buildPdf(){
  const pdf = new PDF(), W = pdf.W, H = pdf.H, M = 40, CW = W - 2*M;
  let y = H - M;
  const ensure = need => { if(y - need < M + 24){ pdf.newPage(); y = H - M; return true; } return false; };
  // intestazione
  pdf.text(M, y - 18, 'Computo metrico', 20, true, 'left', C_ACC);
  pdf.text(W - M, y - 16, new Date().toLocaleDateString('it-IT', {day:'numeric', month:'long', year:'numeric'}), 10, false, 'right', C_MUT);
  y -= 40;
  pdf.text(M, y, fitTxt(D.name, 13, CW, true), 13, true); y -= 15;
  const fp = folderPath(D.folderId).map(f => f.name).join(' › ');
  if(fp){ pdf.text(M, y, fitTxt(fp, 9.5, CW), 9.5, false, 'left', C_MUT); y -= 10; }
  pdf.line(M, y, W - M, y); y -= 16;

  const table = (cols, rows, total) => {
    const rh = 18, hh = 20;
    const head = () => { pdf.fillRect(M, y - hh, CW, hh, C_HEAD); let x = M; cols.forEach(c => { pdf.text(c.r ? x + c.w - 5 : x + 5, y - 13.5, c.t, 8.5, true, c.r ? 'right' : 'left', C_MUT); x += c.w; }); y -= hh; };
    ensure(hh + rh*2); head();
    rows.forEach(r => {
      if(ensure(rh)) head();
      let x = M;
      cols.forEach((c, j) => { const t = fitTxt(r[j], 9, c.w - 10, j === 0); pdf.text(c.r ? x + c.w - 5 : x + 5, y - 12.5, t, 9, j === 0, c.r ? 'right' : 'left'); x += c.w; });
      y -= rh; pdf.line(M, y, W - M, y, [0.9,0.92,0.95], 0.6);
    });
    if(total){
      if(ensure(rh + 6)) head();
      y -= 3; pdf.fillRect(M, y - rh - 2, CW, rh + 2, [0.91,0.94,1]);
      pdf.text(M + 5, y - 13.5, total[0], 10, true); pdf.text(W - M - 5, y - 13.5, total[1], 10, true, 'right');
      y -= rh + 2;
    }
  };

  if(D.shapes.length){
    const bh = 320;
    pdf.fillRect(M, y - bh, CW, bh, [0.985,0.99,1]); pdf.strokeRect(M, y - bh, CW, bh, [0.88,0.9,0.93]);
    const k = pdfDrawing(pdf, M, y - bh, CW, bh);
    y -= bh + 12;
    if(D.scale){
      const ratio = (D.scale / k) / 0.0352778, pw = Math.pow(10, Math.floor(Math.log10(ratio))), nice = Math.round(ratio / pw * 10) / 10 * pw;
      pdf.text(M, y, 'Scala del disegno (stampa A4) ~ 1:' + nf(nice, 0) + '  ·  unità: ' + D.unit, 8.5, false, 'left', C_MUT); y -= 18;
    }
    pdf.text(M, y - 4, 'Superfici', 13, true); y -= 14;
    let tot = 0;
    const rows = D.shapes.map((s, i) => {
      const a = shapeAreaCm2(s), p = shapePerimCm(s); if(a) tot += a;
      return [String(i+1), s.name || typeName(s), (s.name ? typeName(s) + ': ' : '') + dimsText(s), p != null ? fmtLen(p, 'm') : '—', a != null ? fmtArea(a, 'm') : (s.closed ? '—' : 'aperta')];
    });
    table([{t:'N°', w:28}, {t:'Descrizione', w:140}, {t:'Forma e misure', w:187}, {t:'Perimetro', w:72, r:true}, {t:'Superficie', w:88, r:true}], rows,
      D.scale ? ['Totale superficie', fmtArea(tot, 'm')] : null);
    if(!D.scale){ y -= 14; pdf.text(M, y, 'Il disegno non ha ancora misure reali: le superfici non possono essere calcolate.', 9, false, 'left', C_MUT); y -= 6; }
    y -= 22;
  }
  if(D.solids.length){
    ensure(330);
    pdf.text(M, y - 4, 'Volumi', 13, true); y -= 14;
    const img = shot3D(1200, 640);
    if(img){ const ih = CW * 640/1200; ensure(ih + 10); pdf.image(img, 1200, 640, M, y - ih, CW, ih); pdf.strokeRect(M, y - ih, CW, ih, [0.88,0.9,0.93]); y -= ih + 12; }
    let tot = 0;
    const rows = D.solids.map((so, i) => { const v = solidVol(so); if(v != null) tot += v; return [String(i+1), so.name || solidName(so), (so.name ? solidName(so) + ': ' : '') + solidDims(so), v != null ? fmtVol(v) : '—', v != null ? fmtLitri(v) : '—']; });
    table([{t:'N°', w:28}, {t:'Descrizione', w:140}, {t:'Solido e misure', w:187}, {t:'Volume', w:78, r:true}, {t:'Litri', w:82, r:true}], rows, ['Totale volume', fmtVol(tot) + '  (' + fmtLitri(tot) + ')']);
  }
  // piè di pagina
  pdf.pages.forEach((pg, i) => { pdf.c = pg; pdf.line(M, M - 6, W - M, M - 6, [0.9,0.92,0.95], 0.6); pdf.text(M, M - 20, 'Misure Forme · ' + fitTxt(D.name, 8, 300), 8, false, 'left', C_MUT); pdf.text(W - M, M - 20, 'Pagina ' + (i+1) + ' di ' + pdf.pages.length, 8, false, 'right', C_MUT); });
  return pdf.build();
}
function pdfDrawing(pdf, bx, by, bw, bh){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  D.shapes.forEach(s => s.pts.forEach(p => { x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); }));
  const pad = 34, k = Math.min((bw - 2*pad)/Math.max(x1-x0, 1e-12), (bh - 2*pad)/Math.max(y1-y0, 1e-12));
  const cx = (x0+x1)/2, cy = (y0+y1)/2, P = q => [bx + bw/2 + (q.x - cx)*k, by + bh/2 - (q.y - cy)*k];
  D.shapes.forEach(s => {
    let o = '';
    [s.pts, ...(s.holes||[])].forEach(r => { r.forEach((q, i) => { const [x, y] = P(q); o += `${n2(x)} ${n2(y)} ${i ? 'l' : 'm'}\n`; }); if(s.closed) o += 'h\n'; });
    pdf.op(`0.9 0.94 1 rg 0.14 0.19 0.26 RG 0.9 w 1 J 1 j\n${o}${s.closed ? 'B*' : 'S'}`);
  });
  if(D.scale) D.shapes.forEach(s => {
    if(isCurved(s) || (s.geo && !geoAllMeasured(s))) return;
    const n = s.pts.length, C = P(s.closed ? centroid(s.pts) : {x:s.pts.reduce((a,p)=>a+p.x,0)/n, y:s.pts.reduce((a,p)=>a+p.y,0)/n});
    for(let i=0;i<segCount(s);i++){
      const A = P(s.pts[i]), B = P(s.pts[(i+1)%n]), L = Math.hypot(B[0]-A[0], B[1]-A[1]);
      if(L < 34 || (!s.geo && s.measures[i] == null)) continue;
      const mid = [(A[0]+B[0])/2, (A[1]+B[1])/2]; let nx = -(B[1]-A[1])/L, ny = (B[0]-A[0])/L;
      if(nx*(mid[0]-C[0]) + ny*(mid[1]-C[1]) < 0){ nx = -nx; ny = -ny; }
      pdf.text(mid[0] + nx*10, mid[1] + ny*10 - 2.5, fmtLen(segLenCm(s, i)), 6.5, false, 'center', [0.3,0.35,0.42]);
    }
  });
  D.shapes.forEach((s, i) => {
    const n = s.pts.length, c = P(s.closed ? centroid(s.pts) : s.pts[Math.floor(n/2)]);
    pdf.circle(c[0], c[1], 7.5, C_ACC); pdf.text(c[0], c[1] - 3, String(i+1), 8, true, 'center', [1,1,1]);
    if(isCurved(s) && D.scale && geoAllMeasured(s)) pdf.text(c[0], c[1] - 18, SH[s.geo.t].lab(s.geo.p), 7, false, 'center', [0.2,0.25,0.32]);
  });
  return k;
}
function shot3D(w, h){
  const sc = buildScene(D.solids); if(!sc.items.length) return null;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.scale(2, 2);
  const cm = {yaw:cam.yaw, pitch:cam.pitch, k:1, px:0, py:0}; fitCam(cm, w/2, h/2 + 40, sc); cm.py -= 4;
  render3D(x, w/2, h/2, cm, {solids:D.solids, sel:null, bg:'#ffffff'});
  const bin = atob(c.toDataURL('image/jpeg', 0.9).split(',')[1]);
  const b = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i);
  return b;
}

document.addEventListener('keydown', e => {
  if(!D || !$('#modal').classList.contains('hidden')) return;
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); undo(); }
  else if(e.key === 'Delete' || e.key === 'Backspace'){ deleteSelected(); }

  else if(mode === '2d'){
    if(e.key === 'v') setTool('select'); else if(e.key === 'l') setTool('line'); else if(e.key === 'f') setTool('free');
    else if(e.key === 'r'){ opts.shape = 'rect'; saveOpts(); setTool('shape'); } else if(e.key === 's') openShapePicker();
  }
});
